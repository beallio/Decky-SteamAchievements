name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Check source metadata agreement
        run: python3 scripts/check_source_metadata.py

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Compile Python entry point
        run: python3 -m py_compile main.py

      - name: Check release version drift
        run: python3 scripts/version_guard.py check-drift "$(node -p "require('./package.json').version")"
